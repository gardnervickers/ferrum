# Cut a stable release from the Actions tab ("Cut a release" > Run workflow)
# or `gh workflow run cut-release.yml -f bump=minor`.
#
# Refuses unless CI passed on main's newest commit. Bumps app/Cargo.toml's
# version, commits "Release vX.Y.Z" to main, tags it, and starts the Release
# workflow on the tag, which builds, tests and publishes it. Installs on the
# stable channel pick it up with `ferrum-update` (or automatically).
name: Cut a release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or an exact version, e.g. 0.2.0 (overrides bump)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: cut-release

jobs:
  cut:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: CI passed on main
        run: |
          sha="$(git rev-parse HEAD)"
          c="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')"
          if [ "$c" != success ]; then
            echo "::error::CI on main ${sha::7} is '$c', not success. Wait for it, or fix main, then run this again."
            exit 1
          fi
      - name: Version
        id: v
        run: |
          cur="$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)"
          if [ -n "${{ inputs.version }}" ]; then
            new="${{ inputs.version }}"; new="${new#v}"
          else
            IFS=. read -r ma mi pa <<< "${cur%%-*}"
            case "${{ inputs.bump }}" in
              major) new="$((ma + 1)).0.0" ;;
              minor) new="$ma.$((mi + 1)).0" ;;
              *) new="$ma.$mi.$((pa + 1))" ;;
            esac
          fi
          [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$new' is not X.Y.Z"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::v$new already exists"; exit 1
          fi
          echo "Ferrum $cur -> $new" >> "$GITHUB_STEP_SUMMARY"
          echo "new=$new" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump, commit and tag
        run: |
          new="${{ steps.v.outputs.new }}"
          sed -i "0,/^version = \".*\"/s//version = \"$new\"/" app/Cargo.toml
          cargo update -w
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$new"
          git tag -a "v$new" -m "Ferrum $new"
          git push origin HEAD:main "v$new"
      - name: Start the release build
        # A tag pushed with the workflow token starts no workflows by itself.
        run: gh workflow run release.yml --ref "v${{ steps.v.outputs.new }}"
