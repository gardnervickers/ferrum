[package]
name = "millgui-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The browser build of the machine screen (scripts/build-web). Same Slint UI,
# drawn by the software renderer into a canvas; state comes from the Pi.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-path", "software-renderer-systemfonts"] }
serde_json = "1"
png = "0.17"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "PointerEvent", "MouseEvent", "WheelEvent", "KeyboardEvent", "Event", "EventTarget", "Performance", "Location", "DomRect", "CssStyleDeclaration", "HtmlElement", "console"] }
console_error_panic_hook = "0.1"

[build-dependencies]
slint-build = "1.19"
uimirror = { path = "../crates/uimirror" }
