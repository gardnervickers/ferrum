# The browser demo's machine (scripts/build-demo). Ferrum reads it for units,
# travel, speeds and modules; the motion comes from Ferrum's built-in
# simulator, never from LinuxCNC. A 4-axis metric mill.
[EMC]
VERSION = 1.1
MACHINE = ferrum-demo
DEBUG = 0

[DISPLAY]
DISPLAY = ferrum
PROGRAM_PREFIX = /demo/nc_files
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0
DEFAULT_LINEAR_VELOCITY = 25
MAX_LINEAR_VELOCITY = 100
DEFAULT_ANGULAR_VELOCITY = 90
MAX_ANGULAR_VELOCITY = 180

[FERRUM]
MODULES = run job manual probe tools offsets conv files util

[RS274NGC]
PARAMETER_FILE = demo.var
SUBROUTINE_PATH = /demo/macros
HAL_PIN_VARS = 1

[EMCMOT]
SERVO_PERIOD = 1000000

[EMCIO]
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[TRAJ]
COORDINATES = X Y Z A
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 25.0
MAX_LINEAR_VELOCITY = 100
DEFAULT_LINEAR_ACCELERATION = 500
MAX_LINEAR_ACCELERATION = 500

[KINS]
KINEMATICS = trivkins coordinates=XYZA
JOINTS = 4

[AXIS_X]
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
MIN_LIMIT = 0
MAX_LIMIT = 430

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = 0
MAX_LIMIT = 430
HOME_SEQUENCE = 1

[AXIS_Y]
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
MIN_LIMIT = -190
MAX_LIMIT = 0

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -190
MAX_LIMIT = 0
HOME_SEQUENCE = 1

[AXIS_Z]
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
MIN_LIMIT = -380
MAX_LIMIT = 0

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -380
MAX_LIMIT = 0
HOME_SEQUENCE = 0

[AXIS_A]
MAX_VELOCITY = 180
MAX_ACCELERATION = 900
MIN_LIMIT = -99999
MAX_LIMIT = 99999

[JOINT_3]
TYPE = ANGULAR
MIN_LIMIT = -99999
MAX_LIMIT = 99999
HOME_SEQUENCE = 1

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 8000
MAX_REVERSE_VELOCITY = 8000
