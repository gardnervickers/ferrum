[package]
name = "millgui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
hal = { path = "../crates/hal" }
linuxcnc = { path = "../crates/linuxcnc" }
# Software renderer: the Pi 5 has no hardware GL under this X11 setup (llvmpipe).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "renderer-software"] }
ctrlc = { version = "3", features = ["termination"] }
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "1.18"
