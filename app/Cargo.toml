[package]
name = "millgui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
hal = { path = "../crates/hal" }
linuxcnc = { path = "../crates/linuxcnc" }
preview = { path = "../crates/preview" }
# Software renderer: the Pi 5 has no hardware GL under this X11 setup (llvmpipe).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "renderer-software"] }
ctrlc = { version = "3", features = ["termination"] }
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tungstenite = "0.29"

[build-dependencies]
slint-build = "1.18"
uimirror = { path = "../crates/uimirror" }

# The Mac simulator window: GPU drawing (software drawing at Retina size is slow).
[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-femtovg"] }
