[package]
name = "ferrum-lcnc"
version = "0.1.1"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ferrum"
path = "src/main.rs"

[dependencies]
lcnc = { path = "../crates/lcnc" }
machine = { path = "../crates/machine" }
preview = { path = "../crates/preview", features = ["gpu"] }
jobcore = { path = "../crates/jobcore" }
# Both renderers: GPU (femtovg on OpenGL) when the driver is a real GPU,
# software otherwise (the Pi 5 currently has only llvmpipe). See renderer.rs.
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "renderer-software", "renderer-femtovg", "unstable-winit-030"] }
ctrlc = { version = "3", features = ["termination"] }
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# SETUP edits ferrum.toml and keeps its comments.
toml_edit = "0.22"
serde_json = "1"
tungstenite = "0.29"

[build-dependencies]
slint-build = "1.19"
uimirror = { path = "../crates/uimirror" }

# The Mac simulator window: winit's macOS backend.
[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["backend-winit", "unstable-winit-030"] }

# Loads libEGL at runtime to ask the GL driver for its name.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# ferrum --boot: a terminal for LinuxCNC's start script (boot.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
