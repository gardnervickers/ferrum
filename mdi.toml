# MDI library for ferrum's MDI tab. Edit freely; ferrum reads it at start.
# Each entry: category (RECENT is built in), label (shown large), description
# (the help line), brief (optional: a shorter description for the card),
# fill (put on the command line; end it with a letter to ask for a value),
# moves (true if it moves the machine; shown as a tag).
# Tuned to this mill: metric, G30 = tool setter, G28 = park, 4250 rpm max, mist only.

categories = ["MOVE", "OFFSET", "SPINDLE", "TOOL", "MODE"]

[[entry]]
category = "MOVE"
label = "G0 X Y"
description = "Rapid to X Y in the active WCS"
fill = "G0 X"
moves = true

[[entry]]
category = "MOVE"
label = "G53 G0 Z0"
description = "Retract Z to the top of travel"
fill = "G53 G0 Z0"
moves = true

[[entry]]
category = "MOVE"
label = "G1 X Y Z F"
description = "Feed move at F mm/min"
fill = "G1 X"
moves = true

[[entry]]
category = "MOVE"
label = "G0 A"
description = "Turn the rotary to an angle in the active WCS"
brief = "Turn the rotary to an angle"
