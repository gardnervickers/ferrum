# millgui machine settings. Lives beside mdi.toml in millgui/ (or set
# [MILLGUI]MACHINE_CONFIG in the INI). Leave a key out to use the default
# shown here; a file that fails to parse falls back to these defaults and
# says so in the status line.

# The quick buttons under the overrides, on every screen.
[buttons]
mist = true
flood = true
# Also hidden when the drawbar HAL module is not fitted.
drawbar = true
home_all = true

# The table and tool drawn in the backplot (mm). Defaults are a PM-728VT with
# mymill.ini's travel. Machine coordinates are LinuxCNC's: the controlled
# point is the spindle nose and Z 0 is the top of travel.
[model]
show = true
# Table length (X), depth (Y), thickness.
table = [800, 180, 55]
# Machine X Y with the spindle over the middle of the table.
table_center = [215, -90]
# T-slots along X.
slots = 3
# Spindle nose above the table top at machine Z 0.
nose_above_table = 380
